name: Windows CI and release validation

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, and validate packaging
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_eligible: ${{ steps.version.outputs.release_eligible }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Read and classify build version
        id: version
        shell: pwsh
        run: |
          . "${{ github.workspace }}\packaging\VersionPolicy.ps1"
          $record = Get-GraphReaderCentralVersion -RepositoryRoot "${{ github.workspace }}"
          $version = $record.Value
          $releaseEligible = $record.ReleaseEligible
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_eligible=$($releaseEligible.ToString().ToLowerInvariant())" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Build version: $version"
          Write-Host "Release-version eligible: $releaseEligible"

      - name: Validate checkpoint version advancement
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\Prepare-CheckpointVersion.ps1"
          -CheckHead

      - name: Test version and release policy
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\tests\Test-VersionPolicy.Tests.ps1"

      - name: Test build ledger generation
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\tests\Test-GenerateBuildLedger.Tests.ps1"

      - name: Test portable build retention
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\tests\Test-DevPortable.Tests.ps1"

      - name: Restore
        shell: pwsh
        run: dotnet restore GraphAutoReader.slnx

      - name: Build
        shell: pwsh
        run: dotnet build GraphAutoReader.slnx --configuration Release --no-restore --nologo

      - name: Test
        shell: pwsh
        run: dotnet test GraphAutoReader.slnx --configuration Release --no-build --no-restore --nologo

      - name: Test localization audit
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\localization\Test-LocalizationAudit.ps1"

      - name: Test in-memory OCR metric accounting
        shell: pwsh
        run: |
          dotnet build tools/GraphReader.SyntheticRuntimeEvidence/GraphReader.SyntheticRuntimeEvidence.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'OCR metric tool build failed.' }
          dotnet tools/GraphReader.SyntheticRuntimeEvidence/bin/Release/net10.0-windows/win-x64/GraphReader.SyntheticRuntimeEvidence.dll --self-test-original-db-ocr-aggregate
          if ($LASTEXITCODE -ne 0) { throw 'OCR metric self-tests failed.' }
          dotnet tools/GraphReader.SyntheticRuntimeEvidence/bin/Release/net10.0-windows/win-x64/GraphReader.SyntheticRuntimeEvidence.dll --self-test-sealed-ocr-first-read
          if ($LASTEXITCODE -ne 0) { throw 'OCR first-read self-tests failed.' }
          dotnet tools/GraphReader.SyntheticRuntimeEvidence/bin/Release/net10.0-windows/win-x64/GraphReader.SyntheticRuntimeEvidence.dll --self-test-sealed-ocr-source-mapping
          if ($LASTEXITCODE -ne 0) { throw 'OCR source mapping self-tests failed.' }
          dotnet tools/GraphReader.SyntheticRuntimeEvidence/bin/Release/net10.0-windows/win-x64/GraphReader.SyntheticRuntimeEvidence.dll --self-test-sealed-ocr-annotation
          if ($LASTEXITCODE -ne 0) { throw 'OCR annotation self-tests failed.' }
          dotnet tools/GraphReader.SyntheticRuntimeEvidence/bin/Release/net10.0-windows/win-x64/GraphReader.SyntheticRuntimeEvidence.dll --self-test-sealed-ocr-archive
          if ($LASTEXITCODE -ne 0) { throw 'OCR archive self-tests failed.' }
          dotnet tools/GraphReader.SyntheticRuntimeEvidence/bin/Release/net10.0-windows/win-x64/GraphReader.SyntheticRuntimeEvidence.dll --self-test-sealed-ocr-corpus
          if ($LASTEXITCODE -ne 0) { throw 'OCR corpus self-tests failed.' }

      - name: Test release artifact validation
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\tests\Test-ReleaseArtifact.Tests.ps1"

      - name: Validate packaging definitions
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\Test-ReleaseArtifact.ps1"

      - name: Audit packaging without producing release artifacts
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\Build-Windows.ps1" -AuditOnly

  package-release-candidate:
    name: Build validated Windows release candidates
    needs: build-and-test
    if: github.event_name != 'pull_request' && needs.build-and-test.outputs.release_eligible == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RELEASE_ROOT: artifacts/windows/${{ needs.build-and-test.outputs.version }}-win-x64/release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate release-version gate
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\Test-ReleaseArtifact.ps1"
          -RequireReleaseVersion

      - name: Build Windows artifacts from the common publish output
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\Build-Windows.ps1" -Force

      - name: Validate release artifacts
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\Test-ReleaseArtifact.ps1"
          -RequireReleaseVersion -ArtifactRoot $env:RELEASE_ROOT

      - name: Upload validated installer, portable ZIP, checksums, and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GraphAutoReader-${{ needs.build-and-test.outputs.version }}-win-x64
          path: |
            ${{ env.RELEASE_ROOT }}/GraphAutoReader-${{ needs.build-and-test.outputs.version }}-win-x64-setup.exe
            ${{ env.RELEASE_ROOT }}/GraphAutoReader-${{ needs.build-and-test.outputs.version }}-win-x64-portable.zip
            ${{ env.RELEASE_ROOT }}/SHA256SUMS.txt
            ${{ env.RELEASE_ROOT }}/sbom.cdx.json
            ${{ env.RELEASE_ROOT }}/release-metadata.json
            ${{ env.RELEASE_ROOT }}/RELEASE_NOTES.md
            ${{ env.RELEASE_ROOT }}/KNOWN_LIMITATIONS.md
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  publish-release:
    name: Publish tagged GitHub release
    needs:
      - build-and-test
      - package-release-candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out tagged repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate annotated release tag
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\Test-ReleaseTag.ps1"
          -TagName "${{ github.ref_name }}"

      - name: Download validated release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: GraphAutoReader-${{ needs.build-and-test.outputs.version }}-win-x64
          path: ${{ runner.temp }}/GraphAutoReader-release

      - name: Revalidate downloaded release files
        shell: pwsh
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File "${{ github.workspace }}\packaging\Test-ReleaseArtifact.ps1"
          -RequireReleaseVersion
          -ArtifactRoot "$env:RUNNER_TEMP\GraphAutoReader-release"

      - name: Publish immutable GitHub release
        shell: pwsh
        run: |
          $version = '${{ needs.build-and-test.outputs.version }}'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'GraphAutoReader-release'
          $files = @(
              (Join-Path $releaseRoot "GraphAutoReader-$version-win-x64-setup.exe"),
              (Join-Path $releaseRoot "GraphAutoReader-$version-win-x64-portable.zip"),
              (Join-Path $releaseRoot 'SHA256SUMS.txt'),
              (Join-Path $releaseRoot 'sbom.cdx.json'),
              (Join-Path $releaseRoot 'release-metadata.json'),
              (Join-Path $releaseRoot 'KNOWN_LIMITATIONS.md')
          )
          & gh release create '${{ github.ref_name }}' @files `
              --verify-tag `
              --title "Graph Auto Reader $version" `
              --notes-file (Join-Path $releaseRoot 'RELEASE_NOTES.md')
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release publication failed with exit code $LASTEXITCODE."
          }
